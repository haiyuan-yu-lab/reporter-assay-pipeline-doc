site_name: Reporter Assay Pipeline
site_description: User guide and CLI reference for the Yu Lab reporter assay pipeline
site_url: https://haiyuan-yu-lab.github.io/reporter-assay-pipeline-doc/
repo_url: https://github.com/haiyuan-yu-lab/reporter-assay-pipeline-doc
repo_name: haiyuan-yu-lab/reporter-assay-pipeline-doc

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: en

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Learn:
      - Assay overview: assay-model.md
      - Reporter assay concepts: reporter-assay-concepts.md
      - Reporter assay normalization: reporter-assay-normalization.md
      - Cap assay concepts: cap-assay-concepts.md
      - Glossary: glossary.md
  - Run Reporter Assay Pipeline:
      - Workflow overview: workflow.md
      - Prepare inputs: input-preparation.md
      - Complete run example: complete-command-paths.md
      - Prepare libraries (Steps 1–2): steps-1-2.md
      - Build the PreTran identifier map (Steps 3–5): steps-3-5.md
      - Quantify PostTran replicates (Steps 6–8): steps-6-8.md
      - Call activity (Step 9): steps-9.md
      - Troubleshooting: reporter/troubleshooting.md
  - Run Cap Assay Pipeline:
      - Workflow overview: cap-selection/workflow.md
      - Prepare inputs and reference: cap-selection/prepare-inputs.md
      - Complete run example: cap-selection/complete-run.md
      - Prepare and align reads (Steps 1–3): cap-selection/steps-1-3.md
      - Generate endpoint tracks (Step 4): cap-selection/step4.md
      - Troubleshooting: cap-selection/troubleshooting.md
  - References:
      - Reporter assay:
          - Pipeline CLI: cli/pipe.md
          - QC CLI: cli/qc.md
          - Export CLI: cli/export.md
          - Format contracts: reporter/formats.md
          - Resource guidance: reporter/resource-guidance.md
          - Known limitations: reporter/known-limitations.md
      - Cap assay:
          - Pipeline CLI: cli/cap-assay.md
          - Format contracts: cap-selection/formats.md
          - Resource guidance: cap-selection/resource-guidance.md
          - Known limitations: cap-selection/known-limitations.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
