site_name: Reporter Assay Pipeline
site_description: User guide and CLI reference for the Yu Lab reporter assay pipeline
site_url: https://haiyuan-yu-lab.github.io/reporter-assay-pipeline-doc/
repo_url: https://github.com/haiyuan-yu-lab/reporter-assay-pipeline-doc
repo_name: haiyuan-yu-lab/reporter-assay-pipeline-doc

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: en

nav:
  - Home: index.md
  - Tasks: tasks.md
  - Quickstart: quickstart.md
  - Learn:
      - Assay model: assay-model.md
      - Canonical glossary: glossary.md
  - Run:
      - Prepare inputs: input-preparation.md
      - Layout schemas: layout-schemas.md
      - Complete command paths: complete-command-paths.md
      - Workflow and stage handoffs: workflow.md
      - Steps 1–2: steps-1-2.md
      - Steps 3–5: steps-3-5.md
      - Steps 6–8: steps-6-8.md
      - Step 9: steps-9.md
  - Diagnose:
      - FAQ: faq.md
      - Known limitations: known-limitations.md
  - Reference:
      - CLI overview: cli/index.md
      - Pipeline CLI: cli/pipe.md
      - QC CLI: cli/qc.md
      - Export CLI: cli/export.md
      - Artifact formats: formats.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
